name: Bug
description: Something in kadeep or releasegate is broken
labels: [bug]
body:
  - type: input
    id: command
    attributes: { label: Command you ran, placeholder: 'npx kadeep test http://localhost:3000 "…" --json' }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Versions, placeholder: 'kadeep --version · node --version · OS' }
  - type: textarea
    id: report
    attributes: { label: report.json or --json output (remove anything private), render: json }
